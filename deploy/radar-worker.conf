; Queue worker for Radar de Licitaciones.
; Install to /etc/supervisor/conf.d/radar-worker.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; The worker reads its restart heartbeat from the database on every loop, so a
; momentary MySQL outage (an unattended-upgrade restart, for example) kills the
; process. That is expected: supervisor is what makes it resilient, by bringing
; the worker straight back once the database answers again.

[program:radar-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/radar/artisan queue:work database --queue=default --sleep=3 --tries=3 --backoff=30 --max-time=3600 --max-jobs=500
directory=/var/www/html/radar
autostart=true

; Always bring the worker back, including after a database blip.
autorestart=true
; Tolerate repeated early exits while the database is still coming up.
startretries=10
; Treat the process as "running" only once it survives this long.
startsecs=5

user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/radar/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; Let an in-flight job finish before the worker is replaced.
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
